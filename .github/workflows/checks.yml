name: Application checks

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :prompt-contract:jvmTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile all tests and run offline catalog checks
        env:
          PROMPT_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
        run: ./gradlew.bat -PdesktopBuildType=release :prompt-contract:jvmTest :shared:desktopTest --tests '*UseCaseTest' --tests '*PromptSynchronizerTest' --tests '*LegacyCatalogSafetyTest' --tests '*PromptExtensionsTest' --tests '*CatalogDatabaseSafetyTest' --tests '*PromptWireRoundTripTest' --tests '*PromptDetailComponentTest' --tests '*PromptImprovementHttpTest' --tests '*MultiStackRestorationTest' --tests '*AdaptiveShellScreenshotTest' --tests '*CompactChatScreenshotTest' --tests '*PersonalVaultDatabaseTest' --tests '*PersonalVaultScreenshotTest' --tests '*SettingsPagerNavigationTest' --tests '*SharedConversationScreenshotTest' --tests '*UiPolishTest' :desktopApp:createDistributable --console=plain
      - name: Verify debug tools cannot enter an installer
        run: |
          ./gradlew.bat -PdesktopBuildType=debug :shared:desktopTest --tests '*MultiStackRestorationTest' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $guardLog = Join-Path $env:RUNNER_TEMP 'debug-installer-guard.log'
          ./gradlew.bat -PdesktopBuildType=debug :desktopApp:packageMsi --console=plain *> $guardLog
          if ($LASTEXITCODE -eq 0) { throw 'Debug installer was unexpectedly allowed' }
          if (-not (Get-Content -LiteralPath $guardLog -Raw).Contains('Installers must use release mode')) { throw 'Installer failed for an unrelated reason' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-portable
          path: desktop/desktopApp/build/compose/binaries/main/app/AIPrompts/
          if-no-files-found: error
