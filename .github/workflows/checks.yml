name: Application checks

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :prompt-contract:jvmTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile all tests and run offline catalog checks
        run: ./gradlew.bat :prompt-contract:jvmTest :shared:desktopTest --tests '*UseCaseTest' --tests '*PromptSynchronizerTest' --tests '*LegacyCatalogSafetyTest' :desktopApp:createDistributable --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-portable
          path: desktop/desktopApp/build/compose/binaries/main/app/AIPrompts/
          if-no-files-found: error
